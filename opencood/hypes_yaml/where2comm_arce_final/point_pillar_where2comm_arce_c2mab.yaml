name: point_pillar_where2comm_arce_c2mab

root_dir: /data/opv2x/train
validate_dir: /data/opv2x/validate

wild_setting:
  seed: 20
  async: false
  async_mode: sim
  async_overhead: 100
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2
  data_size: 1.06
  transmission_speed: 27
  backbone_delay: 10

# =========================================================
# Link-level Markov channel states
# State order: [good, medium, bad]
# Good   -> [0.85, 0.13, 0.02]
# Medium -> [0.10, 0.80, 0.10]
# Bad    -> [0.03, 0.17, 0.80]
# =========================================================
channel_state_markov:
  enabled: true
  scope: link
  initial_state: medium
  init_state: medium
  states:
    - good
    - medium
    - bad
  transition_matrix:
    good:
      good: 0.85
      medium: 0.13
      bad: 0.02
    medium:
      good: 0.10
      medium: 0.80
      bad: 0.10
    bad:
      good: 0.03
      medium: 0.17
      bad: 0.80
  transition_matrix_list:
    - [0.85, 0.13, 0.02]
    - [0.10, 0.80, 0.10]
    - [0.03, 0.17, 0.80]

  # Fixed delay used by the new setting.
  # good / medium use current frame.
  # bad uses previous frame.
  delay_ms:
    good: 10.0
    medium: 50.0
    bad: 100.0

  profiles:
    good:
      bandwidth_mbps: 27.0
      loss_rate: 0.05
      plr: 0.05
      delay_ms: 10.0
      fixed_delay_ms: 10.0
      jitter_ms: [0.0, 0.0]
      temporal_source: current

    medium:
      bandwidth_mbps: 5.0
      loss_rate: 0.20
      plr: 0.20
      delay_ms: 50.0
      fixed_delay_ms: 50.0
      jitter_ms: [0.0, 0.0]
      temporal_source: current

    bad:
      bandwidth_mbps: 1.0
      loss_rate: 0.35
      plr: 0.35
      delay_ms: 100.0
      fixed_delay_ms: 100.0
      jitter_ms: [0.0, 0.0]
      temporal_source: previous_frame

seed: 2026
yaml_parser: load_point_pillar_params

train_params:
  batch_size: 1
  epoches: 50
  eval_freq: 1
  save_freq: 1
  max_cav: 5

fusion:
  core_method: IntermediateFusionDataset
  args: []

preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: &voxel_size
      - 0.4
      - 0.4
      - 4
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
    cav_lidar_range: &cav_lidar_range
      - -140.8
      - -38.4
      - -3
      - 140.8
      - 38.4
      - 1

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST:
      - x
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE:
      - -0.78539816
      - 0.78539816
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE:
      - 0.95
      - 1.05

postprocess:
  core_method: VoxelPostprocessor
  anchor_args:
    cav_lidar_range: *cav_lidar_range
    l: 3.9
    w: 1.6
    h: 1.56
    r:
      - 0
      - 90
    num: 2
    feature_stride: 4
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: point_pillar_where2comm_arce
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar_range
    anchor_number: 2
    head_dim: 256
    max_cav: 5
    compression: 0
    backbone_fix: false

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters:
        - 64

    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: &layer_nums
        - 3
        - 5
        - 8
      layer_strides:
        - 2
        - 2
        - 2
      num_filters: &num_filters
        - 64
        - 128
        - 256
      upsample_strides:
        - 1
        - 2
        - 4
      num_upsample_filter:
        - 128
        - 128
        - 128

    shrink_header:
      kernal_size:
        - 3
      stride:
        - 2
      padding:
        - 1
      dim:
        - 256
      input_dim: 384

    where2comm_fusion:
      fully: false
      voxel_size: *voxel_size
      downsample_rate: 4
      in_channels: 256
      multi_scale: true
      layer_nums: *layer_nums
      num_filters: *num_filters
      communication:
        round: 1
        threshold: 0.01
        gaussian_smooth:
          k_size: 5
          c_sigma: 1.0

    # =====================================================
    # ARCE / C2MAB setting inside model.args
    # Keep this consistent with top-level arce below.
    # =====================================================
    arce:
      enabled: true
      mode: dc2mab
      policy: dc2mab_sender_ego
      link_scope: non_ego
      seed: 2026

      # -----------------------------
      # Action space
      # send x quant x rho x cache
      # 2 x 3 x 3 x 2 = 36
      # -----------------------------
      action_space:
        type: final_36

        send:
          - 0
          - 1
        send_values:
          - 0
          - 1

        quant:
          - fp16
          - int8
          - int4
        quant_modes:
          - fp16
          - int8
          - int4

        rho:
          - 0.0
          - 0.25
          - 0.5
        redundancy_ratios:
          - 0.0
          - 0.25
          - 0.5

        cache:
          - 0
          - 1
        cache_values:
          - 0
          - 1

        proposal_send_only: true

        # FEC action type. Keep FEC / redundancy.
        # If your action_space.py only supports one main FEC mode,
        # this will use raptor_sim for rho > 0.
        fec_main: raptor_sim
        fec_mode: raptor_sim
        xor_group_size: 4
        decode_overhead: 0.0

      context:
        dim: 6
        use_complementarity: false
        normalize_bandwidth_by_mbps: 27.0
        normalize_delay_by_ms: 100.0
        b_max_mbps: 27.0
        stale_max_ms: 100.0
        confidence_threshold: 0.3

      c2mab:
        context_dim: 6
        ridge_lambda: 1.0
        lambda_reg: 1.0
        discount: 0.97
        exploration_beta: 1.0
        beta: 1.0
        update_feedback: link_proxy_reward

      reward:
        type: final_proxy
        topk_confidence: 20
        confidence_threshold: 0.3
        alpha_q: 0.5
        alpha_cost: 0.3
        alpha_c: 0.3
        alpha_delay: 0.2
        alpha_d: 0.2
        alpha_violation: 1.0
        alpha_v: 1.0
        tau_stale_ms: 300.0
        stale_norm_ms: 100.0
        stale_max_ms: 100.0
        q_min: 0.3

      ego_oracle:
        type: diversity_greedy_knapsack

        # New rule:
        # total bandwidth is a system-level budget,
        # then equally split among collaborators.
        budget_scope: system_equal_split
        budget_source: system_budget_equal_split

        max_budget_cavs: 4
        lambda_comp: 0.0
        lambda_red: 0.0
        eps: 1.0e-06

      channel:
        mode: markov
        initial_state: medium
        init_state: medium
        seed: 2026
        states:
          - good
          - medium
          - bad

        transition_matrix:
          - [0.85, 0.13, 0.02]
          - [0.10, 0.80, 0.10]
          - [0.03, 0.17, 0.80]

        # Bernoulli packet loss:
        # receive_i ~ Bernoulli(1 - PLR_t)
        loss_model: bernoulli
        bernoulli_loss_rates:
          good: 0.05
          medium: 0.20
          bad: 0.35

        # Fixed delay, no jitter.
        latency_model: fixed_state_delay
        fixed_delay_ms:
          good: 10.0
          medium: 50.0
          bad: 100.0

        jitter_ms:
          good: [0.0, 0.0]
          medium: [0.0, 0.0]
          bad: [0.0, 0.0]

        profiles:
          good:
            bandwidth_mbps: 27.0
            loss_rate: 0.05
            plr: 0.05
            delay_ms: 10.0
            fixed_delay_ms: 10.0
            jitter_ms: [0.0, 0.0]
            temporal_source: current

          medium:
            bandwidth_mbps: 5.0
            loss_rate: 0.20
            plr: 0.20
            delay_ms: 50.0
            fixed_delay_ms: 50.0
            jitter_ms: [0.0, 0.0]
            temporal_source: current

          bad:
            bandwidth_mbps: 1.0
            loss_rate: 0.35
            plr: 0.35
            delay_ms: 100.0
            fixed_delay_ms: 100.0
            jitter_ms: [0.0, 0.0]
            temporal_source: previous_frame

      delay:
        policy_by_state:
          good: current
          medium: current
          bad: previous_frame

      scheduler:
        fps: 10
        tx_window_ms: 100.0
        frame_interval_ms: 100.0

        # New rule:
        # system_budget_mbps is the total system budget.
        # per-link budget = system_budget / num_collaborators.
        budget_source: system_budget
        budget_scope: system_equal_split
        per_link_budget: false
        equal_split_by_collaborators: true

        # Change this value if you want another system-level budget.
        system_budget_mbps: 5.0
        total_budget_mbps: 5.0

      # New packetization:
      # Quantize first, then flatten Q(F) into byte stream,
      # then split by fixed packet length Lp = 1024 Bytes.
      packetizer:
        mode: byte_stream
        packet_size_bytes: 1024
        Lp: 1024
        quantize_first: true
        flatten_after_quantization: true

      # Disable old spatial patch packetization.
      # Otherwise it conflicts with byte-stream packetization.
      patch_selection:
        enabled: false
        source: none
        patch_selector: none
        ranking: none
        enforce_link_budget: false
        metadata_bytes_per_packet: 0
        min_effective_patch_ratio: 0.0
        min_patch_count: 0
        strict_min_patch: false

      latency:
        enabled: true
        model: fixed_state_delay
        deadline_ms: 100.0
        frame_interval_ms: 100.0
        proc_delay_ms: 0.0
        jitter_ms: 0.0
        late_policy: state_temporal_policy
        tau_stale_ms: 100.0
        fixed_delay_ms:
          good: 10.0
          medium: 50.0
          bad: 100.0
        policy_by_state:
          good: current
          medium: current
          bad: previous_frame

      # Keep FEC / redundancy.
      fec:
        enabled: true
        type: action
        default_type: raptor_sim
        apply_to: byte_stream_packets
        apply_to_selected_packets_only: false
        xor_group_size: 4
        decode_overhead: 0.0

      redundancy:
        enabled: true
        ratios:
          - 0.0
          - 0.25
          - 0.5
        parity_rule: ceil_source_packets_times_rho

      recovery:
        temporal_cache: true
        spatial_interpolation: true
        zero_fill: true

      temporal_fusion:
        enabled: true
        beta: 5.0
        tau_stale_ms: 300.0
        use_delay_penalty: true
        update_rule: recv_bernoulli_cache

      metrics:
        save_frame_records: true
        save_link_records: true
        save_detection_state_index: true
        success_q_min: 0.3
        success_min_effective_patch_ratio: 0.0

loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0

optimizer:
  core_method: Adam
  lr: 2e-4
  args:
    eps: 1e-10
    weight_decay: 1e-2

lr_scheduler:
  core_method: cosineannealwarm
  epoches: 50
  warmup_lr: 2e-5
  warmup_epoches: 10
  lr_min: 5e-6

# =========================================================
# Top-level ARCE.
# Keep this synchronized with model.args.arce.
# Some scripts read top-level arce and then sync it into model.args.arce.
# =========================================================
arce:
  enabled: true
  mode: dc2mab
  policy: dc2mab_sender_ego
  link_scope: non_ego
  seed: 2026

  action_space:
    type: final_36

    send:
