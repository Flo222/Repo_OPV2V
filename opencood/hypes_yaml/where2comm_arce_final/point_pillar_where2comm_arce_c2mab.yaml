  delay:
    policy_by_state:
      good: current
      medium: current
      bad: previous_frame

  scheduler:
    fps: 10
    tx_window_ms: 100.0
    frame_interval_ms: 100.0
    budget_source: system_budget
    budget_scope: system_equal_split
    per_link_budget: false
    equal_split_by_collaborators: true

    # Total system bandwidth budget.
    # Per-link budget = system_budget_mbps / number_of_collaborators.
    system_budget_mbps: 5.0
    total_budget_mbps: 5.0

  packetizer:
    mode: byte_stream
