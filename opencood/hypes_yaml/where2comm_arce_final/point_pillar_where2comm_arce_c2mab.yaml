    transition_matrix:
      - [0.85, 0.13, 0.02]
      - [0.10, 0.80, 0.10]
      - [0.03, 0.17, 0.80]

    loss_model: bernoulli
    bernoulli_loss_rates:
      good: 0.05
      medium: 0.20
      bad: 0.35

    latency_model: fixed_state_delay
    fixed_delay_ms:
      good: 10.0
      medium: 50.0
      bad: 100.0

    jitter_ms:
      good: [0.0, 0.0]
      medium: [0.0, 0.0]
      bad: [0.0, 0.0]

    profiles:
