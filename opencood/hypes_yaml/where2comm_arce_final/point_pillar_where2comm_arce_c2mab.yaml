  reward:
    type: final_proxy
    topk_confidence: 20
    confidence_threshold: 0.3
    alpha_q: 0.5
    alpha_cost: 0.3
    alpha_c: 0.3
    alpha_delay: 0.2
    alpha_d: 0.2
    alpha_violation: 1.0
    alpha_v: 1.0
    tau_stale_ms: 300.0
    stale_norm_ms: 100.0
    stale_max_ms: 100.0
    q_min: 0.3

  ego_oracle:
    type: diversity_greedy_knapsack
    budget_scope: system_equal_split
    budget_source: system_budget_equal_split
    max_budget_cavs: 4
    lambda_comp: 0.0
    lambda_red: 0.0
    eps: 1.0e-06

  channel:
    mode: markov
    initial_state: medium
